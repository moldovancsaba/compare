name: planner
conversation:
  mode: dedicated
  thread: compare-autonomous-maintenance
schedule:
  offset: 30m
  every: 3h
agent: planner
workspace:
  write: true
memory:
  - .codex/memory/project_state.json
  - .codex/memory/backlog.json
  - .codex/memory/architecture.md
tools:
  - github
  - filesystem
constraints:
  - prefer_existing_issues
  - keep_v1_watch_scope
  - do_not_create_implementation_branches
consent:
  approval_prompting: disabled
  granted_by: product_owner
  scope: planning_and_project_state
prompt: |
  Review the GitHub Project Board and shared memory.

  Select the 5 highest impact next tasks.
  Prioritize:
  - reliability
  - resolver correctness
  - velocity
  - architecture stability
  - UX quality
  - maintainability

  Update priorities, roadmap state, and backlog memory.
