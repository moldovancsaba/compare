name: audit
conversation:
  mode: dedicated
  thread: compare-autonomous-maintenance
schedule:
  every: 3h
agent: audit
workspace:
  write: true
memory:
  - .codex/memory/project_state.json
  - .codex/memory/backlog.json
  - .codex/memory/architecture.md
tools:
  - github
  - filesystem
  - terminal
constraints:
  - never_delete_production_files
  - never_force_push
  - never_merge_without_tests
  - prefer_existing_issues
consent:
  approval_prompting: disabled
  granted_by: product_owner
  scope: repository_maintenance
prompt: |
  Audit the {compare} codebase.

  Responsibilities:
  - identify bugs
  - detect tech debt
  - detect dead code
  - detect security issues
  - identify missing tests
  - identify missing documentation

  Then:
  - create or update GitHub issues
  - update GitHub project board when project tools are available
  - prioritize findings
  - update shared memory
