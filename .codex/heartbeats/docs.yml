name: docs
conversation:
  mode: dedicated
  thread: specdiff-autonomous-maintenance
schedule:
  offset: 120m
  every: 3h
agent: docs
workspace:
  write: true
memory:
  - .codex/memory/project_state.json
  - .codex/memory/backlog.json
  - .codex/memory/architecture.md
tools:
  - github
  - filesystem
  - terminal
constraints:
  - never_merge_without_tests
  - docs_must_match_code
  - do_not_claim_unverified_work
consent:
  approval_prompting: disabled
  granted_by: product_owner
  scope: documentation_and_release_state
prompt: |
  Update:
  - onboarding docs
  - README.md
  - architecture docs
  - handover docs
  - changelog
  - versioning docs

  Then:
  - validate build when dependencies are available
  - commit changes
  - push safe updates to origin/main
  - update shared memory
